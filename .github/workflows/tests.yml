name: Model checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ".[mesh]"
      - run: python -c "import numpy, vtk, trimesh, scipy; import yarnstand.mesh"
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_ui.js
      - run: python -m yarnstand preset --out examples/ci.json
      - run: python -m yarnstand run examples/ci.json --out results/ci.json
