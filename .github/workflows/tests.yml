name: Model checks
on: [push, pull_request]
jobs:
  yarn:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yarn/stand-simulator
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ".[mesh]"
      - run: python -c "import numpy, vtk, trimesh, scipy; import yarnstand.mesh"
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_ui.js
      - run: python tools/validate_snag_workflow.py --out "${{ runner.temp }}/snag-workflow"
      - run: python -m yarnstand preset --out examples/ci.json
      - run: python -m yarnstand run examples/ci.json --out results/ci.json
  vehicles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vehicles/toy-physics
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python run.py --output "${{ runner.temp }}/toy-physics-pla"
      - run: python run.py --material PETG --output "${{ runner.temp }}/toy-physics-petg"
